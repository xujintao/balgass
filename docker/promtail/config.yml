server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://host.docker.internal:3100/loki/api/v1/push

scrape_configs:
  - job_name: caddy
    static_configs:
      - targets: ["localhost"]
        labels:
          job: caddy
          log_type: caddy-access
          __path__: /var/log/caddy-fail2ban/access.log
      - targets: ["localhost"]
        labels:
          job: caddy
          log_type: caddy-fail2ban
          __path__: /var/log/caddy-fail2ban/fail2ban.log
      - targets: ["localhost"]
        labels:
          job: caddy
          log_type: caddy-patch-http
          __path__: /var/log/caddy-fail2ban/patch-http.log
      - targets: ["localhost"]
        labels:
          job: caddy
          log_type: caddy-patch-https
          __path__: /var/log/caddy-fail2ban/patch-https.log
  - job_name: docker
    docker_sd_configs:
      - host: "unix:///var/run/docker.sock"
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/(pgsql|server-game|server-connect)"
        action: keep
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        replacement: "$1"
        target_label: container_name
      - replacement: "docker"
        target_label: job
