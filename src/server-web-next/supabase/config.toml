project_id = "balgass-web"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
[db]
port = 54322
shadow_port = 54320
major_version = 17
[studio]
enabled = true
port = 54323
[inbucket]
enabled = true
port = 54324
[auth]
enabled = true
site_url = "http://localhost:3000"
enable_signup = true
jwt_expiry = 3600
[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 600
[auth.email.template.magic_link]
subject = "你的登录验证码"
content_path = "./supabase/templates/code.html"
[auth.email.template.confirmation]
subject = "你的注册验证码"
content_path = "./supabase/templates/code.html"
[auth.passkey]
enabled = true
[auth.webauthn]
rp_display_name = "Balgass"
rp_id = "localhost"
rp_origins = ["http://localhost:3000"]
[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 30
token_verifications = 30
token_refresh = 150
# Production: enable Auth CAPTCHA (Turnstile) in the Dashboard and configure its secret.
